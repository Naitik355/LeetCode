name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move LeetCode Folders
        run: |
          mkdir -p my-folder

          echo "Folders in repository:"
          find . -maxdepth 1 -type d -print

          echo "Moving LeetCode folders..."

          find . -maxdepth 1 -type d -regex './[0-9]+-.*' -print -exec mv {} my-folder/ \;

      - name: Show Changes
        run: |
          echo "Git status:"
          git status

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: organize LeetHub submissions"
          git push
