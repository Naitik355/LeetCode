name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main  # Change to your default branch name if it isn't main

jobs:
  move-files:
    runs-on: ubuntu-latest
    # Prevent infinite loop cycles by ignoring commits generated by this action itself
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move Root LeetCode Folders to Target Directory
        run: |
          mkdir -p my-folder
          # Find all numerical LeetCode problem folders at root (e.g., 0014-longest-common-prefix)
          # and move them into your subfolder
          find . -maxdepth 1 -type d -regex './[0-9]+-.*' -exec mv {} my-folder/ \;
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@github.com"
          git add .
          # Check if there are actual changes before attempting to commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-organized LeetHub submission to my-folder"
            git push
          fi
