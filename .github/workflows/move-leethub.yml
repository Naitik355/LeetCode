name: Organize LeetHub Submissions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move LeetCode Folders
        run: |
          mkdir -p my-folder

          echo "Root folders before moving:"
          find . -maxdepth 1 -type d -print

          echo "Searching for LeetCode folders..."

          shopt -s nullglob

          for dir in [0-9]*-*; do
            if [ -d "$dir" ]; then
              echo "Moving: $dir"
              mv "$dir" my-folder/
            fi
          done

          echo "Root folders after moving:"
          find . -maxdepth 1 -type d -print

          echo "Folders inside my-folder:"
          find my-folder -maxdepth 1 -type d -print

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: organize LeetHub submissions"
          git push
